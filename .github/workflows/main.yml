
name: Python CI
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python version
        run: python --version
      - name: Check Python syntax
        run: |
          python -m py_compile person1/main.py
          python -m py_compile person1/utils.py
          python -m py_compile person1/merge_example.py
      - name: Test file operations
        run: |
          cd person1
          python -c "from utils import read_text, write_text; import tempfile, os; f = tempfile.NamedTemporaryFile(delete=False); p = f.name; f.close(); write_text(p, 'Hello CI'); assert read_text(p) == 'Hello CI'; os.unlink(p); print('Test passed!')"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Wait for auto-merge demonstration
        run: sleep 120

      - name: Run unit tests
        run: |
          cd person1
          python -m pytest test_utils.py -v
